<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col md="6">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form cForm #updateForm="ngForm" (ngSubmit)="onUpdate(updateForm)">
                <h1>Update Admin</h1>
                <p class="text-body-secondary">Update the root administrator account</p>

                <c-alert color="danger" *ngIf="updateError" class="mt-3">
                  {{ updateError }}
                </c-alert>

                <c-alert color="success" *ngIf="updateSuccess" class="mt-3">
                  Admin user updated successfully.
                </c-alert>

                <!-- Username -->
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input
                    autoComplete="username"
                    cFormControl
                    placeholder="New Username (optional)"
                    name="username"
                    ngModel
                    #username="ngModel"
                  />
                </c-input-group>

                <!-- Password -->
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    autoComplete="new-password"
                    cFormControl
                    placeholder="New Password (optional)"
                    type="password"
                    name="password"
                    ngModel
                    minlength="6"
                    #password="ngModel"
                  />
                </c-input-group>
                <div *ngIf="password.invalid && (password.dirty || password.touched || updateForm.submitted)"
                     cTextColor="danger" class="form-text mb-3">
                  <small *ngIf="password.errors?.['minlength']">Password must be at least 6 characters.</small>
                </div>

                <!-- Repeat Password -->
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    autoComplete="new-password"
                    cFormControl
                    placeholder="Repeat new password"
                    type="password"
                    name="repeatPassword"
                    ngModel
                    #repeatPassword="ngModel"
                  />
                </c-input-group>

                <!-- Submit Button -->
                <c-row>
                  <c-col xs="12">
                    <button cButton class="px-4 w-100" color="primary" type="submit" [disabled]="isLoading || updateForm.invalid">
                      <span *ngIf="isLoading" cSpinner component="span" size="sm" aria-hidden="true"></span>
                      <span *ngIf="isLoading"> Updating...</span>
                      <span *ngIf="!isLoading">Update Account</span>
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
